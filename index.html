<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Passport Photo Generator creates clean, print-ready 26 x 31 mm passport photos with a white background and thin border." />
    <title>Passport Photo Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.process = { env: { NODE_ENV: 'production' } };
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              passport: {
                50: '#eff6ff',
                100: '#dbeafe',
                600: '#2563eb',
                700: '#1d4ed8',
                950: '#172554',
              }
            }
          }
        }
      };
    </script>
    <style>
      body { margin: 0; background: #f8fafc; }
      #root { min-height: 100vh; width: 100vw; }
    </style>
    <script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^4.3.4",
    "vite": "https://esm.sh/vite@^6.0.0",
    "typescript": "https://esm.sh/typescript@^5.8.2",
    "react": "https://esm.sh/react@19.0.0?external=*",
    "react-dom": "https://esm.sh/react-dom@19.0.0?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client?external=react",

  }
}

  </head>
